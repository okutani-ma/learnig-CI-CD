name: CI

on: 
    pull_request:
        branches: main
    push:
        branches: main

permissions:
    contents: read
    
jobs:
    Test:
        name: Ruff and Test
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Setup python
              uses: actions/setup-python@v7
              with:
                python-version: '3.13'
                cache: pip
                cache-dependency-path: pyproject.toml
            
            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                python -m pip install -e ".[ci]"

            - name: Run ruff
              run: python -m ruff check .
            
            - name: Run pytest
              run: python -m pytest

            - name: Docker build
              run: |
                docker build -f app/dockerfile -t test-app .

            - name: Docker run
              run: |
                docker run -p 5000:5000 test-app