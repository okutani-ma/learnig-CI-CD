name: CI

on: 
    pull_request:
        branches: main
    push:

permissions:
    contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
    
jobs:
    lint:
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - uses: actions/checkout@v7

            - name: Setup python
              uses: actions/setup-python@v7
              with:
                python-version: '3.13'
                cache: pip
                cache-dependency-path: pyproject.toml
            
            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                python -m pip install -e ".[ci]"

            - name: Run ruff
              run: python -m ruff check .
            
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        
        steps:
            - uses: actions/checkout@v7

            - name: Setup python
              uses: actions/setup-python@v7
              with:
                python-version: '3.13'
                cache: pip
                cache-dependency-path: pyproject.toml
            
            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                python -m pip install -e ".[ci]"

            - name: Run pytest
              run: python -m pytest

    docker-build:
        needs: [lint, test]
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - uses: actions/checkout@v7

            - name: Build Docker image
              run: docker build -f app/dockerfile -t test-app .